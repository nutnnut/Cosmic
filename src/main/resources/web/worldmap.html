<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bot World Map (stage 1)</title>
<script src="https://unpkg.com/konva@9/konva.min.js"></script>
<style>
  html,body{margin:0;height:100%;font:13px system-ui,sans-serif;background:#10141c;color:#cdd6e4;overflow:hidden}
  #c{position:absolute;top:0;left:0;right:300px;bottom:0}
  #side{position:absolute;top:0;right:0;bottom:0;width:300px;box-sizing:border-box;padding:12px;
        background:#171c26;border-left:1px solid #283143;overflow:auto}
  h1{font-size:15px;margin:0 0 2px}
  .sub{color:#67748c;font-size:11px;margin:0 0 10px}
  button{background:#2a3346;color:#cdd6e4;border:1px solid #3a4761;border-radius:4px;padding:5px 9px;cursor:pointer;margin:2px 0}
  button:hover{background:#34405a}
  a{color:#6cc6ff}
  #status{margin-top:8px;color:#9fb0c8}
  textarea{width:100%;height:300px;margin-top:8px;background:#0d1017;color:#cdd6e4;border:1px solid #283143;font:11px monospace}
</style>
</head>
<body>
<div id="c"></div>
<div id="side">
  <h1>Bot World Map</h1>
  <p class="sub">stage 1 &middot; <a href="/">graph view</a><br>drag map to move &middot; click to resize (corner handles) &middot; scroll to zoom</p>
  <button id="export">Export positions</button>
  <button id="fit">Reset view</button>
  <div id="status">loading...</div>
</div>
<script>
const host = document.getElementById('c');
const stage = new Konva.Stage({container:'c', width:host.clientWidth, height:host.clientHeight, draggable:true});
const layer = new Konva.Layer();
stage.add(layer);
const tr = new Konva.Transformer({keepRatio:true, rotateEnabled:false, anchorStroke:'#c08bff', borderStroke:'#c08bff'});
layer.add(tr);
window.addEventListener('resize', () => stage.size({width:host.clientWidth, height:host.clientHeight}));

// pan = drag background; deselect on empty click
stage.on('click tap', e => { if(e.target===stage) tr.nodes([]); });
// wheel zoom around pointer
stage.on('wheel', e => {
  e.evt.preventDefault();
  const old = stage.scaleX(), p = stage.getPointerPosition();
  const to = {x:(p.x-stage.x())/old, y:(p.y-stage.y())/old};
  const ns = e.evt.deltaY > 0 ? old/1.1 : old*1.1;
  stage.scale({x:ns,y:ns});
  stage.position({x:p.x-to.x*ns, y:p.y-to.y*ns});
});

(async function init(){
  let data;
  try { data = await (await fetch('/api/worldmaps')).json(); }
  catch(e){ document.getElementById('status').textContent = 'failed to load /api/worldmaps'; return; }
  const wms = data.worldmaps;
  const cols = Math.ceil(Math.sqrt(wms.length)), CELL = 480, S = 0.45;
  let totalSpots = 0;
  wms.forEach((wm, i) => {
    const g = new Konva.Group({
      x:(i % cols) * CELL, y:Math.floor(i / cols) * CELL,
      scaleX:S, scaleY:S, draggable:true});
    g.setAttr('wmid', wm.id);
    // spots first (drawn over the image once it loads)
    wm.spots.forEach(s => {
      const dot = new Konva.Circle({x:s.x, y:s.y, radius:5, fill:'#39d353', stroke:'#0d1017', strokeWidth:1.5});
      dot.setAttr('map', s.map);
      dot.on('mouseover', () => { document.getElementById('status').textContent = 'WorldMap'+wm.id+'  map '+s.map; });
      g.add(dot);
    });
    totalSpots += wm.spots.length;
    const imgEl = new Image();
    imgEl.onload = () => {
      const img = new Konva.Image({image:imgEl, x:0, y:0, listening:true});
      g.add(img); img.moveToBottom(); layer.batchDraw();
    };
    imgEl.onerror = () => layer.batchDraw();
    imgEl.src = '/wm/' + wm.id + '.png';
    g.on('click tap', e => { e.cancelBubble = true; tr.nodes([g]); layer.batchDraw(); });
    layer.add(g);
  });
  document.getElementById('status').textContent = wms.length + ' worldmaps, ' + totalSpots + ' spots';
  layer.batchDraw();
})();

document.getElementById('export').onclick = () => {
  const lines = layer.find('Group').map(g =>
    '        wm.put("' + g.getAttr('wmid') + '", new double[]{'
    + Math.round(g.x()) + ', ' + Math.round(g.y()) + ', ' + g.scaleX().toFixed(3) + '});').sort();
  const text = lines.join('\n');
  document.getElementById('status').innerHTML = 'WORLDMAP_LAYOUT (' + lines.length + ')';
  let ta = document.getElementById('out');
  if(!ta){ ta = document.createElement('textarea'); ta.id='out'; ta.readOnly=true; document.getElementById('side').appendChild(ta); }
  ta.value = text; ta.focus(); ta.select();
  try { navigator.clipboard.writeText(text); } catch(e){}
};
document.getElementById('fit').onclick = () => { stage.scale({x:1,y:1}); stage.position({x:0,y:0}); stage.batchDraw(); };
</script>
</body>
</html>
