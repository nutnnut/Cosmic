<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bot World Map</title>
<script src="https://unpkg.com/konva@9/konva.min.js"></script>
<style>
  html,body{margin:0;height:100%;font:13px system-ui,sans-serif;background:#10141c;color:#cdd6e4;overflow:hidden}
  #c{position:absolute;top:0;left:280px;right:300px;bottom:0}
  #left{position:absolute;top:0;left:0;bottom:0;width:280px;box-sizing:border-box;padding:12px;
        background:#171c26;border-right:1px solid #283143;overflow:auto}
  #side{position:absolute;top:0;right:0;bottom:0;width:300px;box-sizing:border-box;padding:12px;
        background:#171c26;border-left:1px solid #283143;overflow:auto}
  #roster{margin-top:8px}
  .rosterItem{padding:4px 6px;border-radius:4px;cursor:pointer}
  .rosterItem:hover{background:#222a38}
  .meta{color:#67748c;font-size:0.85em}
  #fontRow{font-size:11px;color:#8a99b3;margin-bottom:8px}
  #fontRow input{width:130px;margin:0 0 0 6px;padding:0;vertical-align:middle}
  #tip{position:absolute;display:none;pointer-events:none;background:#0d1017;border:1px solid #3a4761;
       border-radius:4px;padding:6px 8px;font-size:11px;line-height:1.45;z-index:10;max-width:240px;
       box-shadow:0 2px 8px rgba(0,0,0,.5)}
  h1{font-size:15px;margin:0 0 2px}
  .sub{color:#67748c;font-size:11px;margin:0 0 10px}
  button{background:#2a3346;color:#cdd6e4;border:1px solid #3a4761;border-radius:4px;padding:5px 9px;cursor:pointer;margin:2px 0}
  button:hover{background:#34405a}
  a{color:#6cc6ff}
  input{width:100%;box-sizing:border-box;background:#0d1017;color:#cdd6e4;border:1px solid #283143;border-radius:4px;padding:5px 7px;margin:4px 0}
  #status{margin-top:8px;color:#9fb0c8}
  #detail{margin-top:10px;line-height:1.5;border-top:1px solid #283143;padding-top:8px;min-height:40px}
  #detail .occ{color:#9fb0c8}
  .legend{margin-top:10px;font-size:11px;color:#8a99b3}
  .legend span{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
  textarea{width:100%;height:240px;margin-top:8px;background:#0d1017;color:#cdd6e4;border:1px solid #283143;font:11px monospace}
</style>
</head>
<body>
<div id="c"></div>
<div id="left">
  <h1>Online</h1>
  <p class="sub" id="rosterHead">loading...</p>
  <input id="search" placeholder="filter name (contains)">
  <button id="searchBtn">Search</button>
  <button id="centerBtn">Center</button>
  <div id="roster"></div>
</div>
<div id="side">
  <div id="fontRow">font size<input id="fontSlider" type="range" min="10" max="22" value="13"></div>
  <h1>Bot World Map</h1>
  <p class="sub"><a href="/">graph view</a> &middot; drag map to move &middot; click map to resize &middot; scroll to zoom<br>
     click node: detail &middot; right-click node: custom anchor (relative/absolute)</p>
  <button id="export">Export positions</button>
  <button id="fit">Reset view</button>
  <div class="legend">
    <div><span style="background:#39d353"></span>player here
         <span style="background:#ff9d4d;margin-left:8px"></span>bots only
         <span style="background:#3a4658;margin-left:8px"></span>empty</div>
    <div style="margin-top:3px"><span style="background:#6b7a99;border:2px solid #c08bff"></span>hub (town others return to)
         <span style="background:#3a4658;border:2px solid #ff5555;margin-left:8px"></span>unreturnable &#9888;</div>
    <div style="margin-top:3px"><span style="background:#23262e;border:2px dashed #7a8290"></span>unreachable by bot &#8856;</div>
  </div>
  <div id="status">loading...</div>
  <div id="detail"></div>
</div>
<div id="tip"></div>
<script>
const host = document.getElementById('c');
const stage = new Konva.Stage({container:'c', width:host.clientWidth, height:host.clientHeight, draggable:true});
const imageLayer = new Konva.Layer();   // worldmap PNGs (draggable, resizable)
const edgeLayer  = new Konva.Layer({listening:false}); // portal/taxi links, over the maps, under the dots
const dotLayer   = new Konva.Layer();   // map nodes, constant screen size
stage.add(imageLayer); stage.add(edgeLayer); stage.add(dotLayer);
const tr = new Konva.Transformer({keepRatio:true, rotateEnabled:false, anchorStroke:'#c08bff', borderStroke:'#c08bff'});
imageLayer.add(tr);
window.addEventListener('resize', () => stage.size({width:host.clientWidth, height:host.clientHeight}));

// pan = drag background; deselect + clear detail on empty click
stage.on('click tap', e => { if(e.target===stage){ tr.nodes([]); imageLayer.batchDraw(); } });
stage.on('wheel', e => {
  e.evt.preventDefault();
  const old = stage.scaleX(), p = stage.getPointerPosition();
  const to = {x:(p.x-stage.x())/old, y:(p.y-stage.y())/old};
  const ns = e.evt.deltaY > 0 ? old/1.1 : old*1.1;
  stage.scale({x:ns,y:ns});
  stage.position({x:p.x-to.x*ns, y:p.y-to.y*ns});
});

const wmImg = {};       // wmId -> Konva.Image
const nodes = {};       // mapId / nodeId -> [instance,...]  (registered under id + every constituent map)
const allInst = [];     // every node instance once (iterate this; nodes{} is multi-keyed for lookups)
const instByWm = {};    // wmId -> [instance,...]  (fast per-worldmap recompute on drag/resize)
const edgesByWm = {};   // wmId -> [edgeLine,...]
let edgeLines = [];     // {ia, ib, line}  — one drawn line per connected instance pair
let live = {};          // mapId -> {players:[{n,l,j}], bots:[...]}
let query = '';

const wmAbs = (img, lx, ly) => { const s = img.scaleX(); return {x: img.x()+s*lx, y: img.y()+s*ly}; };

// occupancy aggregates over a node's constituent maps (a merged node can cover several)
function instOccupants(inst){
  const out = [];
  for(const m of inst.maps){ const o = live[m]; if(!o) continue;
    for(const c of o.players) out.push(['P',c]); for(const c of o.bots) out.push(['B',c]); }
  return out;
}
// ring priority: unreachable(grey) > danger(red) > custom(cyan) > hub(purple) > spot(light) > plain
function styleNode(inst){
  inst.circle.dash([]); inst.circle.opacity(1);
  if(inst.unreachable){ // worldmap location no bot can reach — exists in WZ, not in the bot graph
    inst.circle.fill('#23262e'); inst.circle.stroke('#7a8290'); inst.circle.strokeWidth(1.6);
    inst.circle.dash([2,2]); inst.circle.opacity(0.55); return;
  }
  let hasP=false, hasB=false;
  for(const m of inst.maps){ const o=live[m]; if(o){ if(o.players.length)hasP=true; if(o.bots.length)hasB=true; } }
  inst.circle.fill(hasP ? '#39d353' : hasB ? '#ff9d4d' : inst.anchor ? '#6b7a99' : '#3a4658');
  if(inst.danger){ inst.circle.stroke('#ff5555'); inst.circle.strokeWidth(2.2); }
  else if(inst.custom){ inst.circle.stroke('#22d3ee'); inst.circle.strokeWidth(2.6); inst.circle.dash(inst.absolute?[4,3]:[]); }
  else if(inst.hub){ inst.circle.stroke('#c08bff'); inst.circle.strokeWidth(2.4); }
  else if(inst.anchor){ inst.circle.stroke('#46577a'); inst.circle.strokeWidth(1.4); }
  else { inst.circle.stroke('#0d1017'); inst.circle.strokeWidth(1); }
}
function matches(inst){
  if(!query) return false;
  return instOccupants(inst).some(([k,c]) => c.n.toLowerCase().includes(query));
}
function applyStyle(){
  for(const inst of allInst){
    styleNode(inst);
    const hit = matches(inst);
    inst.circle.shadowColor('#ffe14d');
    inst.circle.shadowBlur(hit ? 22 : 0);
    inst.circle.shadowOpacity(hit ? 1 : 0);
  }
  dotLayer.batchDraw();
}

function searchMatches(){
  return allInst.filter(matches);
}
// radar ping on the current matches for 3s — attention only, never moves the screen
let pingAnim = null, pingRings = [], pingTargets = [];
function stopPing(){
  if(pingAnim){ pingAnim.stop(); pingAnim = null; }
  pingRings.forEach(r => r.destroy()); pingRings = []; pingTargets = [];
  dotLayer.batchDraw();
}
function pingInstances(targets){
  stopPing();
  if(!targets || !targets.length) return;
  pingTargets = targets;
  pingRings = targets.map(inst => {
    const ring = new Konva.Circle({x:inst.circle.x(), y:inst.circle.y(), radius:6,
      stroke:'#ffe14d', strokeWidth:2.5, listening:false});
    dotLayer.add(ring); return ring;
  });
  pingAnim = new Konva.Animation(frame => {
    if(frame.time > 3000){ stopPing(); return; }
    const phase = (frame.time % 1000) / 1000;   // expand + fade once per second
    const rad = 6 + phase * 24, op = 1 - phase;
    pingRings.forEach((ring, i) => {
      ring.position(pingTargets[i].circle.position()); ring.radius(rad); ring.opacity(op);
    });
  }, dotLayer);
  pingAnim.start();
}
function startPing(){
  if(!query){ document.getElementById('status').textContent = 'type a name first'; return; }
  const m = searchMatches();
  if(!m.length){ document.getElementById('status').textContent = 'no match for "'+query+'"'; return; }
  document.getElementById('status').textContent = m.length + ' match(es) for "'+query+'"';
  pingInstances(m);
}
// for a map with duplicates, prefer the unmerged (single-map) node, then a non-dup one, else the first
function pickInstance(mapId){
  const arr = nodes[mapId]; if(!arr || !arr.length) return null;
  return arr.find(i => i.maps.length===1 && !i.dup) || arr.find(i => i.maps.length===1)
      || arr.find(i => !i.dup) || arr[0];
}
function centerOnMap(mapId){    // global: roster items call this from inline onclick
  const inst = pickInstance(mapId);
  if(!inst){ document.getElementById('status').textContent = 'map '+mapId+' not on screen'; return; }
  const p = inst.circle.position(), s = stage.scaleX();
  stage.position({x: host.clientWidth/2 - p.x*s, y: host.clientHeight/2 - p.y*s});
  stage.batchDraw();
  pingInstances([inst]);
}
function centerOnMatch(){
  const m = searchMatches();
  if(!m.length){ document.getElementById('status').textContent = 'no match to center'; return; }
  centerOnMap(m[0].id);
}
// right-click cycles a node: none -> relative (rides its worldmap) -> absolute (independent) -> none
function cycleCustom(inst){
  if(!inst.custom){ inst.custom = true; inst.absolute = false; }
  else if(!inst.absolute){ inst.absolute = true; const p = inst.circle.position(); inst.absX = p.x; inst.absY = p.y; }
  else { inst.custom = false; inst.absolute = false; inst.lx = inst.lx0; inst.ly = inst.ly0;
         const im = wmImg[inst.wm]; if(im) inst.circle.position(wmAbs(im, inst.lx, inst.ly)); }
  inst.circle.draggable(inst.custom);
  document.getElementById('status').textContent = inst.name + ': '
    + (inst.custom ? (inst.absolute ? 'absolute custom anchor (independent)' : 'relative custom anchor (rides worldmap)') : 'normal');
  styleNode(inst); drawEdges(inst.wm); dotLayer.batchDraw();
}

// reposition one worldmap's nodes (constant radius — they are not children of the scaled image)
function recomputeWm(wmId){
  const img = wmImg[wmId]; if(!img) return;
  for(const inst of (instByWm[wmId]||[])){
    if(inst.absolute) continue;   // absolute custom anchors stay put
    const a = wmAbs(img, inst.lx, inst.ly);
    inst.circle.position(a);
    if(inst.mark) inst.mark.position({x:a.x, y:a.y});
  }
  drawEdges(wmId);
  dotLayer.batchDraw();
}

function drawOne(el){
  el.line.points([el.ia.circle.x(), el.ia.circle.y(), el.ib.circle.x(), el.ib.circle.y()]);
}
function drawEdges(wmId){
  const list = wmId==null ? edgeLines : (edgesByWm[wmId]||[]);
  list.forEach(drawOne);
  edgeLayer.batchDraw();
}

const esc = s => String(s).replace(/[&<>]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));
const occLine = (k,c) => (k==='P'?'&#128100; ':'&#129302; ')+esc(c.n)+'  Lv'+c.l+' '+esc(c.j);
const occupants = map => { const o = live[map]; return o ? [...o.players.map(c=>['P',c]), ...o.bots.map(c=>['B',c])] : []; };

let selectedMap = null;
function showDetail(inst){
  selectedMap = inst.id;
  const flags = [inst.hub?'hub':null, inst.anchor?'worldmap spot':null, inst.dup?'on multiple worldmaps':null,
                 inst.danger?'UNRETURNABLE':null, inst.unreachable?'UNREACHABLE BY BOT':null,
                 inst.leaf?'dead-end':null].filter(Boolean).join(' &middot; ');
  const merged = inst.maps.length > 1;
  // single node -> one merged section (no repeated sub-header / divider); merged -> a section per map
  const boxes = inst.maps.map((m,i) =>
    '<div id="mb'+m+'" style="margin-top:8px">'
    + (merged ? '<b>'+esc(inst.names[i])+' ('+m+')</b>' : '')
    + '<div class="body" style="margin-top:4px">loading…</div></div>').join('');
  document.getElementById('detail').innerHTML =
    '<b>'+esc(inst.name)+' ('+inst.maps.join(', ')+')</b><br>WorldMap'+inst.wm + (flags?'<br>'+flags:'') + boxes;
  inst.maps.forEach(m => fetchMapInfo(m, inst.id));
}
function fetchMapInfo(mapId, token){
  fetch('/api/mapinfo?id='+mapId).then(r=>r.json()).then(d=>{
    if(selectedMap !== token) return;          // a newer node was clicked while this was loading
    const box = document.getElementById('mb'+mapId); if(!box) return;
    const statusOf = {}; (d.bots||[]).forEach(b => statusOf[b.name] = b.status);
    // players first, then bots; each bot's @botstatus inline directly under it
    const lines = occupants(mapId).map(([k,c]) => {
      const head = (k==='P'?'&#128100; ':'&#129302; ') + esc(c.n) + ' Lv'+c.l+' ' + esc(c.j);
      return (k==='B' && statusOf[c.n])
        ? head + '<br><span class="meta" style="margin-left:16px">'+esc(statusOf[c.n])+'</span>'
        : head;
    });
    const occHtml = lines.length ? lines.join('<br>') : 'nobody here';
    const mobs = d.mobs.length                                  // skip the section entirely when no spawns
      ? '<br><br><b>Mobs</b><br>'+d.mobs.map(m => esc(m.name)+' Lv'+m.level+(m.spawns>1 ? ' x'+m.spawns : '')).join('<br>')
      : '';
    const chat = (d.chat && d.chat.length)
      ? '<br><br><b>Chat</b><br>'+d.chat.map(c => '<span class="meta">'+c.t+'</span> '+esc(c.n)+': '+esc(c.m)).join('<br>') : '';
    box.querySelector('.body').innerHTML = occHtml + mobs + chat;
  }).catch(()=>{ const box=document.getElementById('mb'+mapId); if(box){ const b=box.querySelector('.body'); if(b) b.textContent='failed to load'; } });
}

// hover tooltip: just the characters on the node (class+level) — no mob/status preview
function showTip(inst, evt){
  const occ = instOccupants(inst);
  const tip = document.getElementById('tip');
  tip.innerHTML = '<b>'+esc(inst.name)+'</b><br>' + (occ.length ? occ.map(([k,c]) => occLine(k,c)).join('<br>') : '(empty)');
  tip.style.display = 'block';
  tip.style.left = (evt.clientX + 14) + 'px';
  tip.style.top  = (evt.clientY + 14) + 'px';
}
function hideTip(){ document.getElementById('tip').style.display = 'none'; }

// name of one specific map (a merged node shows its constituents' names aligned to maps)
function mapName(mapId){
  const arr = nodes[mapId];
  if(arr && arr.length){ const i = arr[0].maps.indexOf(mapId); return i>=0 ? arr[0].names[i] : arr[0].name; }
  return 'map '+mapId;
}
// left-panel roster of everyone online; click -> center their map. Rebuild skipped when unchanged
// (keeps scroll); add windowing if a few thousand rows ever jank.
let rosterSig = '';
function renderRoster(){
  const items = [];
  for(const map in live){
    const o = live[map];
    for(const c of o.players) items.push({c, map:+map, bot:false});
    for(const c of o.bots)    items.push({c, map:+map, bot:true});
  }
  const filt = query ? items.filter(it => it.c.n.toLowerCase().includes(query)) : items;
  filt.sort((a,b) => (a.bot-b.bot) || a.c.n.localeCompare(b.c.n));   // players first, then by name
  const players = items.filter(it => !it.bot).length, bots = items.length - players;
  document.getElementById('rosterHead').textContent =
    (query ? filt.length+' shown · ' : '') + players + ' online + ' + bots + ' bots';
  const sig = query + '#' + filt.map(it => it.c.n+'@'+it.map+'/'+it.c.l).join('|');
  if(sig === rosterSig) return;               // unchanged -> skip rebuild (keeps scroll position, saves work)
  rosterSig = sig;
  const el = document.getElementById('roster'), scroll = el.scrollTop;
  el.innerHTML = filt.map(it =>
    '<div class="rosterItem" onclick="centerOnMap('+it.map+')">'
    + (it.bot?'&#129302; ':'&#128100; ') + esc(it.c.n) + ' <span class="meta">Lv'+it.c.l+' '+esc(it.c.j)+'</span>'
    + '<br><span class="meta">'+esc(mapName(it.map))+'</span></div>').join('');  // bot's actual map, not merged
  el.scrollTop = scroll;
}

(async function init(){
  let data;
  try { data = await (await fetch('/api/worldmaps')).json(); }
  catch(e){ document.getElementById('status').textContent = 'failed to load /api/worldmaps'; return; }
  const wms = data.worldmaps;
  let nodeCount = 0;

  wms.forEach((wm, i) => {
    const imgEl = new Image();
    const kimg = new Konva.Image({x:wm.x, y:wm.y, scaleX:wm.scale, scaleY:wm.scale, image:imgEl, draggable:true});
    kimg.setAttr('wmid', wm.id);
    wmImg[wm.id] = kimg;
    imageLayer.add(kimg); kimg.moveToBottom();
    imgEl.onload  = () => imageLayer.batchDraw();
    imgEl.onerror = () => imageLayer.batchDraw();
    imgEl.src = '/wm/' + wm.id + '.png';

    kimg.on('click tap', e => { e.cancelBubble = true; tr.nodes([kimg]); imageLayer.batchDraw(); });
    kimg.on('dragmove', () => recomputeWm(wm.id));

    wm.nodes.forEach(nd => {
      const a = wmAbs(kimg, nd.x, nd.y);
      const r = nd.hub ? 5.5 : nd.anchor ? 4 : (nd.leaf ? 2.6 : 3.2);
      const circle = new Konva.Circle({x:a.x, y:a.y, radius:r});
      const inst = {id:nd.id, maps:nd.maps, names:nd.names, name:nd.names.join(' / '),
                    wm:wm.id, lx:nd.x, ly:nd.y, lx0:nd.x, ly0:nd.y,
                    anchor:nd.anchor, hub:nd.hub, dup:nd.dup, danger:nd.danger, leaf:nd.leaf,
                    unreachable:nd.unreachable, custom:false, absolute:false, absX:0, absY:0,
                    circle, mark:null};
      circle.on('mouseover', e => { document.body.style.cursor='pointer';
        document.getElementById('status').textContent = inst.name+' ('+nd.maps.join(', ')+')'; showTip(inst, e.evt); });
      circle.on('mousemove', e => showTip(inst, e.evt));
      circle.on('mouseout', () => { document.body.style.cursor='default'; hideTip(); });
      circle.on('click tap', e => { e.cancelBubble = true; showDetail(inst); });
      circle.on('contextmenu', e => { e.evt.preventDefault(); e.cancelBubble = true; cycleCustom(inst); });
      circle.on('dragmove', () => { const p = inst.circle.position();
        if(inst.mark) inst.mark.position({x:p.x, y:p.y}); drawEdges(inst.wm); });
      circle.on('dragend', () => {
        if(!inst.custom) return;
        const p = inst.circle.position();
        if(inst.absolute){ inst.absX = p.x; inst.absY = p.y; }
        else { const im = wmImg[inst.wm], s = im.scaleX(); inst.lx = (p.x-im.x())/s; inst.ly = (p.y-im.y())/s; }
        drawEdges(inst.wm);
      });
      dotLayer.add(circle);
      const markText = nd.danger ? '⚠' : nd.unreachable ? '⊘' : null;
      if(markText){
        inst.mark = new Konva.Text({text:markText, fontSize:12, listening:false,
                                    fill: nd.danger ? '#ff5555' : '#9aa3b0'});
        inst.mark.offset({x:inst.mark.width()/2, y:inst.mark.height()/2}); // center the glyph on the node
        inst.mark.position({x:a.x, y:a.y});                                // overlay it on the node
        dotLayer.add(inst.mark);
      }
      allInst.push(inst);
      (instByWm[wm.id] = instByWm[wm.id] || []).push(inst);
      new Set([nd.id, ...nd.maps]).forEach(k => (nodes[k] = nodes[k] || []).push(inst));
      styleNode(inst);
      nodeCount++;
    });
  });

  const addLine = (ia, ib, t) => {
    const line = new Konva.Line({points:[0,0,0,0], stroke: t==='t' ? '#6cc6ff' : '#3a4761',
                                 strokeWidth: t==='t' ? 1.2 : 0.7, opacity:0.8});
    edgeLayer.add(line);
    const el = {ia, ib, line}; edgeLines.push(el);
    new Set([ia.wm, ib.wm]).forEach(w => (edgesByWm[w] = edgesByWm[w] || []).push(el));
  };
  (data.edges || []).forEach(([a,b,t]) => {
    const A = nodes[a], B = nodes[b]; if(!A || !B) return;
    const wmsA = new Set(A.map(i => i.wm));
    const shared = [...new Set(B.map(i => i.wm))].filter(w => wmsA.has(w));
    if(shared.length){                 // draw inside every worldmap holding both ends -> no bare dup nodes
      shared.forEach(w => {
        const ia = A.find(i=>i.wm===w), ib = B.find(i=>i.wm===w);
        if(ia !== ib) addLine(ia, ib, t);   // same dot here (merged together on this worldmap) -> skip
      });
    } else {                           // no shared worldmap: a single closest cross-worldmap link
      let best=null, bd=Infinity;
      for(const ia of A) for(const ib of B){
        const dx=ia.circle.x()-ib.circle.x(), dy=ia.circle.y()-ib.circle.y(), d=dx*dx+dy*dy;
        if(d<bd){ bd=d; best=[ia,ib]; }
      }
      if(best) addLine(best[0], best[1], t);
    }
  });

  document.getElementById('status').textContent = wms.length + ' worldmaps, ' + nodeCount + ' nodes, ' + edgeLines.length + ' links';
  drawEdges(null);
  imageLayer.batchDraw(); dotLayer.batchDraw();

  // resize: positions scale with the worldmap, dot size stays constant; recompute live during the drag
  tr.on('transform', () => { const im = tr.nodes()[0]; if(im) recomputeWm(im.getAttr('wmid')); });
  tr.on('transformend', () => { const im = tr.nodes()[0]; if(im) recomputeWm(im.getAttr('wmid')); });

  poll();
})();

async function poll(){
  try {
    const d = await (await fetch('/api/live')).json();
    live = {};
    for(const id in d.maps) live[id] = d.maps[id];
    applyStyle(); renderRoster();
  } catch(e){ /* keep last */ }
  setTimeout(poll, 2000);
}

document.getElementById('search').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); applyStyle(); renderRoster(); });
document.getElementById('search').addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); startPing(); } });
document.getElementById('searchBtn').onclick = startPing;
document.getElementById('centerBtn').onclick = centerOnMatch;
document.getElementById('fontSlider').addEventListener('input', e => { document.getElementById('side').style.fontSize = e.target.value + 'px'; });
document.getElementById('export').onclick = () => {
  const lines = imageLayer.find('Image').map(im =>
    '        wm.put("' + im.getAttr('wmid') + '", new double[]{'
    + Math.round(im.x()) + ', ' + Math.round(im.y()) + ', ' + im.scaleX().toFixed(3) + '});').sort();
  const customs = [];
  for(const inst of allInst) if(inst.custom){
    customs.push(inst.absolute
      ? '        // custom abs  node ' + inst.id + '  ' + Math.round(inst.absX) + ', ' + Math.round(inst.absY)
      : '        // custom rel  node ' + inst.id + '  wm' + inst.wm + '  ' + Math.round(inst.lx) + ', ' + Math.round(inst.ly));
  }
  const text = lines.join('\n') + (customs.length ? '\n\n        // custom anchors\n' + customs.join('\n') : '');
  document.getElementById('status').textContent = 'WORLDMAP_LAYOUT (' + lines.length + ') + ' + customs.length + ' custom copied';
  let ta = document.getElementById('out');
  if(!ta){ ta = document.createElement('textarea'); ta.id='out'; ta.readOnly=true; document.getElementById('side').appendChild(ta); }
  ta.value = text; ta.focus(); ta.select();
  try { navigator.clipboard.writeText(text); } catch(e){}
};
document.getElementById('fit').onclick = () => { stage.scale({x:1,y:1}); stage.position({x:0,y:0}); stage.batchDraw(); };
</script>
</body>
</html>
